backend:
  name: git-gateway
  branch: main

# Where uploaded images get stored in your repo, and how they're
# referenced publicly on the live site.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Collections = content types you can create/edit from the dashboard.
collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false, hint: "Short summary shown in blog previews" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "media_library"
    label: "Image Library"
    files:
      - label: "Uploads"
        name: "uploads_note"
        file: "assets/uploads/.gitkeep"
        fields:
          - { label: "note", name: "note", widget: "hidden", default: "placeholder" }
