backend:
  name: github
  repo: Ali78-ops/SEO-Services
  branch: main
  base_url: https://decap-cms-oauth-hazel.vercel.app

# Where uploaded images get stored in your repo, and how they're
# referenced publicly on the live site.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Collections = content types you can create/edit from the dashboard.
collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false, hint: "Short summary shown in blog previews" }
      - { label: "Body", name: "body", widget: "markdown" }
